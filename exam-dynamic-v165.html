<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,follow"><title>شرح الفحص | عيادة د. منير الشكري</title><link rel="stylesheet" href="site.css"><style>body{font-family:Tahoma,Arial,sans-serif;background:#f3f9fa;color:#153f50;margin:0;line-height:1.95}.page{max-width:900px;margin:auto;padding:22px 18px 60px}header{background:#0e506d;color:white;padding:18px}header a{color:white;margin-left:20px}.box{background:#fff;border:1px solid #d9e9ed;padding:23px;border-radius:15px;margin:14px 0}.box h2{color:#0a6576;margin:0 0 10px}.photo{width:100%;max-height:350px;object-fit:cover;border-radius:13px}.btn{display:inline-flex;background:#15855d;color:white;padding:10px 19px;border-radius:9px;text-decoration:none;margin-top:12px}a{color:#137154}.note{background:#fff6db;padding:12px;border:1px solid #eee1b3;border-radius:10px}</style></head><body><header><a href="index.html">الرئيسية</a><a href="services-catalog.html">قائمة الفحوصات</a><a href="https://wa.me/967782007272">واتساب</a></header><main class="page"><div id="content"><p>جاري تحميل معلومات الفحص...</p></div></main><script>
(async()=>{const id=new URLSearchParams(location.search).get('id');const root=document.querySelector('#content');const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n};if(!/^[a-z0-9-]{3,90}$/i.test(id||'')){root.textContent='معرّف الفحص غير صالح';return}try{const [d,c]=await Promise.all(['exam-content.json','services-catalog.json'].map(async name=>{let r=await fetch(name);if(!r.ok)throw Error('تعذر تحميل البيانات');return r.json()}));const item=d.items.find(x=>x.id===id);const brief=c.groups.flatMap(g=>g.items).find(x=>x.id===id);if(!item||!brief||brief.visible===false)throw Error('هذا الفحص غير متاح في الدليل حاليًا');root.replaceChildren();root.append(el('h1',item.title||brief.title));if(/^[a-z\d_-]+\.(webp|png|jpe?g)$/i.test(item.image||'')){let im=el('img',null,'photo');im.src=item.image;im.loading='lazy';im.alt=item.imageAlt||'صورة توضيحية';root.append(im)}let sections=[['what','ما هو الفحص؟'],['why','متى قد يطلبه الطبيب؟'],['how','كيف يُجرى؟'],['prep','التحضير قبل الفحص'],['shows','ماذا قد يظهر؟'],['after','بعد الفحص'],['care','تنبيهات مهمة'],['limits','حدود الفحص']];for(let[k,label]of sections){if(!item[k])continue;const card=el('section',null,'box');card.append(el('h2',label),el('p',item[k]));root.append(card)}root.append(el('p','المعلومات تثقيفية ولا تغني عن توجيه الطبيب. تعليمات التحضير تختلف من شخص لآخر.','note'));let a=el('a','استفسر عن الفحص عبر واتساب ←','btn');a.href='https://wa.me/967782007272?text='+encodeURIComponent('مرحبًا، أرغب بالاستفسار عن '+(item.title||brief.title));root.append(a);document.title=(item.title||brief.title)+' | عيادة د. منير الشكري'}catch(err){root.textContent=err.message}})();
</script></body></html>
