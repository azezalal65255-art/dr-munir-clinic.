<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="محتوى توعوي طبي مفصل"><title>مقال طبي | عيادة د. منير الشكري</title><style>*,*:before,*:after{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:#19384a;font:16px/1.85 system-ui,Arial}header{background:linear-gradient(120deg,#0b5776,#1289a0);color:white;padding:25px 5%}header h1{margin:0;font-size:clamp(23px,4vw,36px)}header p{margin:5px 0}main{max-width:1130px;margin:auto;padding:22px 16px}.nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}.nav a,.btn{background:white;color:#0c5673;padding:9px 15px;border-radius:11px;text-decoration:none;font-weight:700}.intro{background:#fff;border:1px solid #d8e6ed;border-radius:15px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:17px}.card{background:white;border:1px solid #d8e6ed;border-radius:15px;overflow:hidden;box-shadow:0 4px 16px #15384a0d}.card img{display:block;width:100%;height:160px;object-fit:cover}.card .body{padding:16px}.card h2{font-size:19px;margin:0 0 6px}.card p{margin:4px 0 13px;color:#526b79;font-size:14px}.card a,.primary{display:inline-block;background:#08799a;color:white;border:0;padding:9px 16px;border-radius:10px;text-decoration:none;font:inherit;cursor:pointer}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}.filters button{border:1px solid #b4ced9;border-radius:30px;padding:8px 13px;background:white;color:#0a526d;font:inherit;cursor:pointer}.filters button.active{background:#08799a;color:white}input,textarea,select{width:100%;border:1px solid #bad1da;border-radius:10px;padding:11px;font:inherit}article.detail{max-width:840px;margin:auto;background:white;padding:clamp(18px,4vw,36px);border-radius:18px}.detail h2{color:#075e80;margin:22px 0 6px}.detail figure{margin:15px 0}.detail img{max-height:370px;width:100%;object-fit:cover;border-radius:12px}.muted,figcaption{color:#607784;font-size:14px}.warning{border-right:4px solid #b47d23;background:#fff6e5;padding:12px;border-radius:8px}footer{padding:25px;text-align:center;color:#496879}button:focus-visible,a:focus-visible{outline:3px solid #e9aa35}@media(prefers-reduced-motion:no-preference){.card{transition:transform .2s}.card:hover{transform:translateY(-3px)}}</style></head><body><header><h1>مقال طبي</h1><p>عيادة د. منير الشكري — الأشعة التشخيصية والدوبلر والخزعات والقساطر</p><nav class="nav"><a href="index.html">الرئيسية</a><a href="services-catalog.html">الفحوصات والخدمات</a><a href="awareness-topics.html">التوعية الطبية</a><a href="site-editor.html">محرر الموقع</a></nav></header><main><article class="detail" id="article"><p>جار تحميل الموضوع...</p></article></main><footer>محتوى تثقيفي لا يغني عن استشارة الطبيب — صنعاء، شارع الزبيري</footer><script>const esc=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('id');fetch('awareness-content.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const a=d.articles.find(x=>x.id===id&&x.visible!==false);if(!a){document.querySelector('#article').textContent='الموضوع غير متاح';return}document.title=a.title+' | عيادة د. منير الشكري';const rows=[['نبذة عن الحالة','overview'],['الأعراض والعلامات','symptoms'],['الأسباب وعوامل الخطورة','causes'],['كيف تُقيّم الحالة؟','diagnosis'],['الفحوص والتحضير','preparation'],['المتابعة والتعامل مع الحالة','care'],['الوقاية وتقليل المخاطر','prevention'],['متى تطلب المساعدة العاجلة؟','urgent'],['سؤال شائع','faq']];document.querySelector('#article').innerHTML=`<h1>${esc(a.title)}</h1><p class="muted">${esc(a.category||'التوعية الطبية')} · ${a.reviewed?'مراجَع طبيًا':'مسودة تثقيفية تنتظر مراجعة الطبيب'}</p><figure><img src="${esc(a.image)}" alt="${esc(a.imageAlt||'صورة توضيحية لمعدات طبية')}"><figcaption>صورة فوتوغرافية إيضاحية لمعدات أو إجراءات طبية، وليست صورة تشخيصية للحالة.</figcaption></figure>${rows.filter(([t,k])=>a[k]).map(([t,k])=>`<section><h2>${t}</h2><p>${esc(a[k])}</p></section>`).join('')}<h2>مراجع للمزيد من القراءة</h2><ul>${(a.sources||[]).filter(s=>/^https:\/\//.test(s.url)).map(s=>`<li><a target="_blank" rel="noopener noreferrer" href="${esc(s.url)}">${esc(s.title||'مصدر طبي')}</a></li>`).join('')}</ul><p class="warning">هذه المعلومات عامة ولا تغني عن التقييم الطبي. في الحالات الطارئة راجع قسم الطوارئ مباشرة.</p><a class="primary" href="awareness-topics.html">عودة إلى مكتبة التوعية</a>`}).catch(()=>document.querySelector('#article').textContent='تعذر تحميل المقال.');</script></body></html>
